# Centralized KPI Catalog & Calculation Contracts
kpis:
  - id: "KPI_01"
    name: "Gross Transaction Value (GTV)"
    definition: "Total cumulative monetary value of all transaction attempts initiated on the platform."
    formula: "SUM(amount)"
    grain: "One transaction attempt"
    unit: "USD Currency"
    source: "fact_transactions.amount"
    sql: "SUM(t.amount)"
    dax: "GTV = SUM(fact_transactions[amount])"
    interpretation: "Measures overall platform transactional volume and scale."
    limitations: "Does not reflect settled funds; includes declines and failed attempts."

  - id: "KPI_02"
    name: "Settled Transaction Value (STV)"
    definition: "Total monetary value of transactions that achieved successful authorization."
    formula: "SUM(CASE WHEN auth_status = 'Approved' THEN amount ELSE 0 END)"
    grain: "One transaction attempt"
    unit: "USD Currency"
    source: "fact_transactions.amount WHERE auth_status = 'Approved'"
    sql: "SUM(CASE WHEN t.auth_status = 'Approved' THEN t.amount ELSE 0 END)"
    dax: "STV = CALCULATE(SUM(fact_transactions[amount]), fact_transactions[auth_status] = \"Approved\")"
    interpretation: "Actual top-line settled payment volume processed for merchants."
    limitations: "Subject to post-settlement chargebacks and customer refunds."

  - id: "KPI_03"
    name: "Total Transaction Volume (TTV)"
    definition: "Count of all distinct transaction attempts initiated."
    formula: "COUNT(transaction_id)"
    grain: "One transaction attempt"
    unit: "Integer Count"
    source: "fact_transactions.transaction_id"
    sql: "COUNT(t.transaction_id)"
    dax: "TTV = COUNTROWS(fact_transactions)"
    interpretation: "High-level platform throughput indicator."
    limitations: "Treats a $1 transaction equally with a $10,000 transaction."

  - id: "KPI_04"
    name: "Authorization Rate (Auth Rate)"
    definition: "Percentage of transaction attempts successfully authorized by the issuer."
    formula: "(Count Approved / Total Count) * 100"
    grain: "Portfolio / Aggregate"
    unit: "Percentage (%)"
    source: "fact_transactions.auth_status"
    sql: "ROUND(100.0 * COUNT(CASE WHEN t.auth_status = 'Approved' THEN 1 END) / NULLIF(COUNT(*), 0), 2)"
    dax: "Auth Rate = DIVIDE(CALCULATE(COUNTROWS(fact_transactions), fact_transactions[auth_status] = \"Approved\"), COUNTROWS(fact_transactions), 0)"
    interpretation: "Core operational efficiency metric. Benchmark is 85-92% for card-not-present."
    limitations: "Can be skewed by aggressive fraud bot attacks or repeated retry loops."

  - id: "KPI_05"
    name: "Gross Merchant Discount Rate (Gross Revenue)"
    definition: "Total processing fees billed to merchants for payment processing."
    formula: "SUM(processing_fee)"
    grain: "One settled transaction"
    unit: "USD Currency"
    source: "fact_transactions.processing_fee"
    sql: "SUM(t.processing_fee)"
    dax: "Gross Revenue = SUM(fact_transactions[processing_fee])"
    interpretation: "Top-line commercial revenue earned by the payment facilitator."
    limitations: "Does not account for non-negotiable pass-through interchange and scheme costs."

  - id: "KPI_06"
    name: "Net Revenue"
    definition: "Gross processing fee revenue minus direct pass-through interchange and network scheme fees."
    formula: "Gross Revenue - SUM(interchange_fee + scheme_fee)"
    grain: "One settled transaction"
    unit: "USD Currency"
    source: "fact_transactions"
    sql: "SUM(t.processing_fee - t.interchange_fee - t.scheme_fee)"
    dax: "Net Revenue = [Gross Revenue] - SUM(fact_transactions[interchange_fee]) - SUM(fact_transactions[scheme_fee])"
    interpretation: "Retained margin available to cover operational, platform, and risk expenses."
    limitations: "Excludes loss provisions from unrecovered fraud chargebacks."

  - id: "KPI_07"
    name: "Net Contribution"
    definition: "Net revenue minus realized chargeback losses and dispute administrative overhead."
    formula: "Net Revenue - SUM(chargeback_losses) - SUM(dispute_fees)"
    grain: "Portfolio / Merchant"
    unit: "USD Currency"
    source: "fact_transactions, fact_disputes"
    sql: "SUM(t.processing_fee - t.interchange_fee - t.scheme_fee) - COALESCE(SUM(d.dispute_amount + d.chargeback_fee), 0)"
    dax: "Net Contribution = [Net Revenue] - [Chargeback Loss Total]"
    interpretation: "True economic contribution of the payment portfolio before corporate overhead."
    limitations: "Requires accurate lag matching of disputes back to original transaction cohorts."

  - id: "KPI_08"
    name: "Transaction Value at Risk (TVaR)"
    definition: "Total monetary value of failed and declined transactions segmented by technical recoverability."
    formula: "SUM(CASE WHEN auth_status IN ('Declined', 'Failed') THEN amount ELSE 0 END)"
    grain: "One transaction attempt"
    unit: "USD Currency"
    source: "fact_transactions"
    sql: "SUM(CASE WHEN t.auth_status != 'Approved' THEN t.amount ELSE 0 END)"
    dax: "TVaR = CALCULATE(SUM(fact_transactions[amount]), fact_transactions[auth_status] <> \"Approved\")"
    interpretation: "Upper bound of transactional value lost at checkout."
    limitations: "Not all declined value is recoverable; hard declines (stolen cards) must be rejected."

  - id: "KPI_09"
    name: "Recoverable Revenue Leakage"
    definition: "Estimated net revenue that would be captured if addressable soft technical and issuer declines were retried."
    formula: "SUM(soft_decline_amount) * blended_take_rate * estimated_recovery_yield"
    grain: "Aggregate category"
    unit: "USD Currency"
    source: "fact_transactions, dim_decline_codes"
    sql: "SUM(CASE WHEN dc.is_retryable THEN t.amount * 0.025 * 0.45 ELSE 0 END)"
    dax: "Recoverable Leakage = [Soft Decline GTV] * 0.025 * 0.45"
    interpretation: "Quantifies the direct commercial business case for smart payment routing and retry logic."
    limitations: "Recovery yields depend on cardholder liquidity and issuer retry velocity rules."

  - id: "KPI_10"
    name: "Chargeback Dispute Rate (BPS)"
    definition: "Ratio of disputed transaction count to settled transaction count in basis points (1 bp = 0.01%)."
    formula: "(Count Disputes / Count Approved Transactions) * 10,000"
    grain: "Merchant / Category monthly"
    unit: "Basis Points (bps)"
    source: "fact_disputes, fact_transactions"
    sql: "ROUND(10000.0 * COUNT(d.dispute_id) / NULLIF(COUNT(DISTINCT t.transaction_id), 0), 2)"
    dax: "Chargeback BPS = DIVIDE([Total Disputes] * 10000, [Settled Transaction Count], 0)"
    interpretation: "Card network compliance metric. Exceeding 90-100 bps triggers card scheme monitoring programs."
    limitations: "Disputes lag transactions by 30-90 days, requiring vintage cohort matching."
